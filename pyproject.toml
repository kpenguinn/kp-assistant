[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-assistant"
version = "0.1.0"
description = "A personal command-line AI assistant powered by the Gemini API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "google-genai>=2.18.0,<3.0.0",
]

[project.scripts]
kp-assistant = "kp_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
